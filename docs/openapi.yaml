openapi: 3.1.0
info:
  title: GastroCore ERP • API Supabase PostgREST (Schema v0.3.0)
  description: |
    Especificação oficial dos contratos **PostgREST** expostos pelo backend Supabase (PostgreSQL 16) do **GastroCore ERP v0.3.0**.

    ### Como os Squads QA-2 e DA-* devem usar este contrato:
    * **Ambiente Web HML:** https://hml.gastrocore.cesic.com.br (alvo de testes e exploração)
    * **Ambiente Web PRD:** https://gastrocore.cesic.com.br (referência somente leitura)
    * **Headers obrigatórios em toda chamada REST:**
      - `apikey: <VITE_SUPABASE_ANON_KEY>`
      - `Authorization: Bearer <VITE_SUPABASE_ANON_KEY>`
    * **Regra de projeção segura (`app_users`):** jamais usar `select=*` em listagens públicas de usuários; projetar apenas `id,email,full_name,role,unit_id,created_at,updated_at`.
    * **Organização:** CESIC Tecnologias (`admcesic@gmail.com`) — Projeto Integrador APONTI.
  version: 0.3.0
  contact:
    name: CESIC Tecnologias • Tech Lead Alison Melo
    email: admcesic@gmail.com
    url: https://hml.gastrocore.cesic.com.br

servers:
  - url: https://{supabase_project_ref}.supabase.co/rest/v1
    description: Supabase Cloud PostgREST (Substituir pela URL do projeto HML fornecido no ambiente)
    variables:
      supabase_project_ref:
        default: jwieztnmxcylgpphpqeo
        description: Referência do projeto Supabase HML (APONTI)
  - url: http://localhost:54321/rest/v1
    description: PostgREST / Supabase CLI Local (Docker)

security:
  - apikeyHeader: []
    bearerAuth: []

tags:
  - name: kitchen_units
    description: Filiais e unidades operacionais (IND-01, HOSP-02, ESC-03)
  - name: ingredients
    description: Almoxarifado, lotes PVPS (JSONB) e níveis de estoque mínimo
  - name: technical_sheets
    description: Fichas técnicas, Fator de Correção (FC), cocção (FCoc) e alérgenos
  - name: daily_menu_plans
    description: Grade semanal de cardápios e cálculo de custo/PAX contratado
  - name: waste_records
    description: Balança RDC 216 (pre_preparo, sobra_limpa, resto_ingesto)
  - name: hot_box_deliveries
    description: Expedição térmica Hot Box (>= 65°C saída / >= 60°C entrega)
  - name: proposal_quotes
    description: Orçamentos comerciais para eventos e contratos
  - name: tenant_configs
    description: Parametrização White-Label da operadora (Bondegusto)
  - name: app_users
    description: Perfis RBAC (7 papéis) e PINs operacionais de KDS
  - name: temperature_logs
    description: Termometria RDC 216 (Cadeia Quente vs Cadeia Fria)
  - name: stock_movements
    description: Kardex auditável de entradas, saídas, perdas e ajustes PVPS
  - name: kds_dish_status
    description: Fila de produção Dark-First do KDS (a_iniciar -> preparando -> pronto)
  - name: system_heartbeat
    description: Keep-Alive anti-sleep via UPSERT (.github/workflows/keep-alive.yml)

paths:
  /kitchen_units:
    get:
      tags: [kitchen_units]
      summary: Listar unidades operacionais (filiais)
      parameters:
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/orderParam'
      responses:
        '200':
          description: Lista de unidades (IND-01, HOSP-02, ESC-03)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KitchenUnit'
    post:
      tags: [kitchen_units]
      summary: Cadastrar unidade operacional
      parameters:
        - $ref: '#/components/parameters/preferReturnParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenUnit'
      responses:
        '201':
          description: Unidade criada
    patch:
      tags: [kitchen_units]
      summary: Atualizar unidade filtrando por `?id=eq.<id>`
      parameters:
        - $ref: '#/components/parameters/idFilterParam'
        - $ref: '#/components/parameters/preferReturnParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenUnit'
      responses:
        '200':
          description: Unidade atualizada

  /ingredients:
    get:
      tags: [ingredients]
      summary: Listar insumos e estoques com filtro opcional por unidade/status
      parameters:
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/unitIdFilterParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Catálogo de insumos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
    post:
      tags: [ingredients]
      summary: Criar ou fazer upsert de insumo (suporta L e rolo)
      parameters:
        - $ref: '#/components/parameters/preferUpsertParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ingredient'
      responses:
        '201':
          description: Insumo registrado
    patch:
      tags: [ingredients]
      summary: Atualizar saldo ou status de insumo (`?id=eq.<id>`)
      parameters:
        - $ref: '#/components/parameters/idFilterParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_stock:
                  type: number
                status:
                  type: string
                  enum: [normal, baixo, vencendo, vencido]
      responses:
        '200':
          description: Saldo atualizado

  /technical_sheets:
    get:
      tags: [technical_sheets]
      summary: Consultar fichas técnicas padronizadas e POPs
      parameters:
        - $ref: '#/components/parameters/selectParam'
      responses:
        '200':
          description: Lista de fichas técnicas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnicalSheet'
    post:
      tags: [technical_sheets]
      summary: Criar ficha técnica com ingredientes JSONB e cooking_factor
      parameters:
        - $ref: '#/components/parameters/preferReturnParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicalSheet'
      responses:
        '201':
          description: Ficha técnica criada

  /daily_menu_plans:
    get:
      tags: [daily_menu_plans]
      summary: Listar planejamento semanal de cardápios
      parameters:
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/unitIdFilterParam'
      responses:
        '200':
          description: Cardápios planejados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyMenuPlan'
    post:
      tags: [daily_menu_plans]
      summary: Cadastrar cardápio diário com arrays de receitas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyMenuPlan'
      responses:
        '201':
          description: Cardápio salvo

  /waste_records:
    get:
      tags: [waste_records]
      summary: Consultar apontamentos da balança RDC 216
      parameters:
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/unitIdFilterParam'
        - $ref: '#/components/parameters/orderParam'
      responses:
        '200':
          description: Lista de pesagens de desperdício
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WasteRecord'
    post:
      tags: [waste_records]
      summary: Registrar pesagem na balança KDS (pre_preparo | sobra_limpa | resto_ingesto)
      parameters:
        - $ref: '#/components/parameters/preferReturnParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WasteRecord'
      responses:
        '201':
          description: Pesagem gravada

  /hot_box_deliveries:
    get:
      tags: [hot_box_deliveries]
      summary: Listar expedições térmicas Hot Box
      parameters:
        - $ref: '#/components/parameters/selectParam'
      responses:
        '200':
          description: Lista de remessas Hot Box
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotBoxDelivery'
    post:
      tags: [hot_box_deliveries]
      summary: Registrar expedição Hot Box (meta saída >= 65°C, entrega >= 60°C)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotBoxDelivery'
      responses:
        '201':
          description: Expedição registrada

  /proposal_quotes:
    get:
      tags: [proposal_quotes]
      summary: Listar orçamentos de eventos e contratos
      parameters:
        - $ref: '#/components/parameters/selectParam'
      responses:
        '200':
          description: Orçamentos comerciais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProposalQuote'
    post:
      tags: [proposal_quotes]
      summary: Criar proposta comercial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalQuote'
      responses:
        '201':
          description: Proposta criada

  /tenant_configs:
    get:
      tags: [tenant_configs]
      summary: Obter configuração White-Label (Bondegusto)
      parameters:
        - $ref: '#/components/parameters/selectParam'
      responses:
        '200':
          description: Configuração de marca e módulos ativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantConfig'
    patch:
      tags: [tenant_configs]
      summary: Atualizar White-Label (`?id=eq.default_tenant`)
      parameters:
        - $ref: '#/components/parameters/idFilterParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfig'
      responses:
        '200':
          description: Configuração atualizada

  /app_users:
    get:
      tags: [app_users]
      summary: Listar perfis operacionais (usar projeção explícita sem password_hash)
      parameters:
        - name: select
          in: query
          schema:
            type: string
            default: id,email,full_name,role,unit_id,created_at
      responses:
        '200':
          description: Usuários projetados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUserPublic'

  /temperature_logs:
    get:
      tags: [temperature_logs]
      summary: Listar logs de termometria RDC 216 (quente e frio)
      parameters:
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/unitIdFilterParam'
        - $ref: '#/components/parameters/orderParam'
      responses:
        '200':
          description: Logs térmicos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemperatureLog'
    post:
      tags: [temperature_logs]
      summary: Registrar aferição térmica (quente >= 60°C | frio <= 4°C ou <= 5°C)
      parameters:
        - $ref: '#/components/parameters/preferReturnParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemperatureLog'
      responses:
        '201':
          description: Aferição registrada

  /stock_movements:
    get:
      tags: [stock_movements]
      summary: Consultar histórico Kardex de movimentações PVPS
      parameters:
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/orderParam'
      responses:
        '200':
          description: Movimentações de Kardex
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovement'
    post:
      tags: [stock_movements]
      summary: Registrar movimentação Kardex (entrada, saida, perda, ajuste)
      parameters:
        - $ref: '#/components/parameters/preferReturnParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovement'
      responses:
        '201':
          description: Movimentação registrada no Kardex

  /kds_dish_status:
    get:
      tags: [kds_dish_status]
      summary: Consultar fila de produção KDS por unidade/turno
      parameters:
        - $ref: '#/components/parameters/selectParam'
        - $ref: '#/components/parameters/unitIdFilterParam'
      responses:
        '200':
          description: Status dos tickets no KDS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KdsDishStatus'
    post:
      tags: [kds_dish_status]
      summary: Atualizar/Upsert status de ticket no KDS (a_iniciar | preparando | pronto)
      parameters:
        - $ref: '#/components/parameters/preferUpsertParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KdsDishStatus'
      responses:
        '201':
          description: Status KDS sincronizado

  /system_heartbeat:
    get:
      tags: [system_heartbeat]
      summary: Consultar último heartbeat anti-sleep (PRD e HML)
      responses:
        '200':
          description: Heartbeats registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemHeartbeat'
    post:
      tags: [system_heartbeat]
      summary: "Executar UPSERT de heartbeat Keep-Alive (header Prefer merge-duplicates)"
      parameters:
        - $ref: '#/components/parameters/preferUpsertParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemHeartbeat'
      responses:
        '201':
          description: Heartbeat atualizado

components:
  securitySchemes:
    apikeyHeader:
      type: apiKey
      in: header
      name: apikey
      description: Chave ANON pública do projeto Supabase HML (`VITE_SUPABASE_ANON_KEY`)
    bearerAuth:
      type: http
      scheme: bearer
      description: Mesmo token ANON ou JWT autenticado

  parameters:
    selectParam:
      name: select
      in: query
      description: Projeção explícita de colunas PostgREST
      schema:
        type: string
        example: "*"
    idFilterParam:
      name: id
      in: query
      required: true
      description: Filtro de igualdade PostgREST
      schema:
        type: string
        example: eq.unit-industrial
    unitIdFilterParam:
      name: unit_id
      in: query
      description: Filtro por unidade (`eq.unit-industrial`, `eq.unit-hospitalar`, `eq.unit-escolar`)
      schema:
        type: string
        example: eq.unit-industrial
    orderParam:
      name: order
      in: query
      schema:
        type: string
        example: created_at.desc
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        example: 50
    preferReturnParam:
      name: Prefer
      in: header
      schema:
        type: string
        default: return=representation
    preferUpsertParam:
      name: Prefer
      in: header
      schema:
        type: string
        default: resolution=merge-duplicates,return=representation

  schemas:
    KitchenUnit:
      type: object
      required: [id, name, code, type, address, manager_name, contact_email]
      properties:
        id: { type: string, example: "unit-industrial" }
        name: { type: string, example: "Unidade Industrial Metalmecânica (Fábrica Alpha)" }
        code: { type: string, example: "IND-01" }
        type: { type: string, enum: [industrial, hospitalar, escolar] }
        address: { type: string }
        manager_name: { type: string }
        contact_email: { type: string, format: email }
        average_pax_per_day: { type: number, example: 550 }
        contract_price_per_pax: { type: number, example: 14.5 }
        status: { type: string, enum: [ativa, manutencao, inativa] }

    Ingredient:
      type: object
      required: [id, name, category, unit]
      properties:
        id: { type: string, example: "ing-alcatra-01" }
        unit_id: { type: string, nullable: true, example: "unit-industrial" }
        name: { type: string, example: "Alcatra Bovina Resfriada" }
        item_type: { type: string, enum: [alimento, descartavel, higiene, utensilio, equipamento] }
        category: { type: string, example: "carnes" }
        unit: { type: string, enum: [kg, g, l, L, ml, un, cx, pct, rolo] }
        current_stock: { type: number, example: 85.0 }
        min_stock: { type: number, example: 40.0 }
        unit_cost: { type: number, example: 42.9 }
        supplier: { type: string }
        expiration_date: { type: string, example: "2026-11-30" }
        status: { type: string, enum: [normal, baixo, vencendo, vencido] }
        allergens: { type: array, items: { type: string } }
        batches: { type: array, items: { type: object } }

    TechnicalSheet:
      type: object
      required: [id, title, category]
      properties:
        id: { type: string, example: "rec-01" }
        title: { type: string, example: "Strogonoff de Carne com Champignon" }
        category: { type: string, enum: [principal, guarnicao, salada, sobremesa, bebida, molho, lanche] }
        yield_portions: { type: number, example: 100 }
        portion_size_grams: { type: number, example: 180 }
        preparation_time_min: { type: integer, example: 45 }
        cooking_factor: { type: number, example: 0.85 }
        ingredients: { type: array, items: { type: object } }
        total_cost: { type: number }
        cost_per_portion: { type: number }
        margin_percent: { type: number }

    DailyMenuPlan:
      type: object
      required: [id, date_str, day_of_week]
      properties:
        id: { type: string }
        unit_id: { type: string, nullable: true }
        date_str: { type: string, example: "2026-11-24" }
        day_of_week: { type: string, example: "Terça-feira" }
        shift: { type: string, example: "Almoço" }
        planned_pax: { type: number, example: 550 }
        price_per_pax_contracted: { type: number, example: 14.5 }
        principais_ids: { type: array, items: { type: string } }
        guarnicoes_ids: { type: array, items: { type: string } }
        bases_ids: { type: array, items: { type: string } }
        saladas_ids: { type: array, items: { type: string } }
        dietas_ids: { type: array, items: { type: string } }

    WasteRecord:
      type: object
      required: [id, unit_id, timestamp, period, operation_type, unit_name, category, item_or_recipe_name, weight_kg, estimated_cost_per_kg, total_loss_brl, reason, reported_by]
      properties:
        id: { type: string, example: "waste-qa-001" }
        unit_id: { type: string, example: "unit-industrial" }
        timestamp: { type: string, example: "2026-11-24T13:30:00Z" }
        period: { type: string, example: "Almoço" }
        operation_type: { type: string, example: "in_loco" }
        unit_name: { type: string, example: "Fábrica Alpha" }
        category: { type: string, enum: [pre_preparo, sobra_limpa, resto_ingesto] }
        item_or_recipe_name: { type: string, example: "Arroz Branco" }
        weight_kg: { type: number, example: 4.5 }
        estimated_cost_per_kg: { type: number, example: 18.2 }
        total_loss_brl: { type: number, example: 81.9 }
        reason: { type: string, example: "Excedente de produção na cuba final" }
        reported_by: { type: string, example: "Chef Antônio Silva" }

    HotBoxDelivery:
      type: object
      required: [id, client_name, vehicle_plate, driver_name, departure_time, arrival_time_estimated, dispatch_temp_celsius, seal_number]
      properties:
        id: { type: string }
        unit_id: { type: string, nullable: true }
        client_name: { type: string }
        vehicle_plate: { type: string }
        driver_name: { type: string }
        departure_time: { type: string }
        arrival_time_estimated: { type: string }
        dispatch_temp_celsius: { type: number, example: 69.0 }
        arrival_temp_celsius: { type: number, nullable: true, example: 63.5 }
        status: { type: string, enum: [em_preparo, em_transito, entregue, nao_conforme] }
        boxes_count: { type: number }
        seal_number: { type: string }
        pax_count: { type: number }

    ProposalQuote:
      type: object
      required: [id, client_name, event_type, event_date]
      properties:
        id: { type: string }
        unit_id: { type: string, nullable: true }
        client_name: { type: string }
        event_type: { type: string, enum: [coffee_break, almoco_corporativo, coquetel, contrato_mensal] }
        event_date: { type: string }
        pax: { type: number }
        target_margin_percent: { type: number }
        final_price_per_pax: { type: number }
        total_proposal_value: { type: number }
        status: { type: string, enum: [rascunho, enviada, aprovada, recusada] }

    TenantConfig:
      type: object
      properties:
        id: { type: string, example: "default_tenant" }
        company_name: { type: string, example: "Bondegusto Alimentação & Serviços Ltda" }
        trading_name: { type: string, example: "Bondegusto Refeições Coletivas" }
        cnpj: { type: string }
        primary_color: { type: string, example: "#059669" }
        active_plan: { type: string, example: "pro" }
        enabled_modules: { type: object }

    AppUserPublic:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [admin, gerente, nutricionista, cozinheiro, estoquista, financeiro, atendente] }
        unit_id: { type: string, nullable: true }

    TemperatureLog:
      type: object
      required: [id, equipment, equipment_type, temperature, is_compliant, time_str, shift]
      properties:
        id: { type: string, example: "temp-qa-01" }
        unit_id: { type: string, example: "unit-industrial" }
        equipment: { type: string, example: "Câmara Fria 02 (Hortifrúti & Lácteos)" }
        equipment_type: { type: string, enum: [quente, frio] }
        temperature: { type: number, example: 4.0 }
        is_compliant: { type: boolean, example: true }
        time_str: { type: string, example: "10:15" }
        shift: { type: string, example: "Almoço" }

    StockMovement:
      type: object
      required: [id, ingredient_id, ingredient_name, type, quantity, unit, previous_stock, new_stock, reason, timestamp, user_name]
      properties:
        id: { type: string }
        ingredient_id: { type: string }
        ingredient_name: { type: string }
        batch_id: { type: string, nullable: true }
        lot_number: { type: string, nullable: true }
        type: { type: string, enum: [entrada, saida, perda, ajuste] }
        quantity: { type: number }
        unit: { type: string }
        unit_cost: { type: number, nullable: true }
        total_cost: { type: number, nullable: true }
        previous_stock: { type: number }
        new_stock: { type: number }
        reason: { type: string }
        timestamp: { type: string }
        user_name: { type: string }

    KdsDishStatus:
      type: object
      required: [id, unit_id, date_str, shift, recipe_id, status]
      properties:
        id: { type: string, example: "unit-industrial_2026-11-24_almoco_rec-01" }
        unit_id: { type: string, example: "unit-industrial" }
