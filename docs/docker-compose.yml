# ==============================================================================
# GastroCore ERP • Docker Compose Local & Homologação VPS (DevOps APONTI)
# Sobe Frontend Nginx SPA + PostgreSQL 16 carregando schema.sql v0.3.0
# Dica: baixe Dockerfile, docker-compose.yml e schema.sql para o mesmo diretório
# ou aponte build.context para a raiz do repositório gastrocore-erp.
# ==============================================================================

services:
  gastrocore-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: homologacao
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: gastrocore-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gastrocore-net

  postgres:
    image: postgres:16-alpine
    container_name: gastrocore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastro_hml_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gastrocore_hml}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastro_user} -d ${POSTGRES_DB:-gastrocore_hml}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gastrocore-net

networks:
  gastrocore-net:
    driver: bridge

volumes:
  pgdata:
