# ==============================================================================
# GastroCore ERP • Modelo de Pipeline CI/CD & GHCR (Trilha DevOps APONTI)
# Fluxo: PR/Push (staging/main) -> Lint/Build -> SAST Trivy -> GHCR -> VPS SSH
# ==============================================================================
name: GastroCore CI/CD & GHCR Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cesic-tecnologias/gastrocore-erp
  NODE_VERSION: '20'

jobs:
  # ETAPA 1: Verificação de Tipos TypeScript & Build Vite
  lint-and-build:
    name: Lint TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build de Homologação (Vite SPA)
        run: npm run build:hml

  # ETAPA 2: DevSecOps (SAST & Auditoria de Dependências)
  security-audit:
    name: DevSecOps SAST & Container Scan
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Auditoria de Dependências NPM
        run: npm audit --audit-level=high

      - name: Varredura Trivy FS (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ETAPA 3: Build Multi-Stage Nginx & Push no GHCR
  build-and-push-ghcr:
    name: Docker Build & Push GHCR
    needs: [lint-and-build, security-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Tags Semânticas e SHA
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build & Push Imagem Otimizada
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_ENV=homologacao
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ETAPA 4: Deploy Contínuo via SSH em VPS Linux (Template Squad DO-4)
  deploy-vps-template:
    name: Deploy Automatizado em VPS Linux (HML)
    needs: build-and-push-ghcr
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && vars.ENABLE_VPS_DEPLOY == 'true'
    environment:
      name: staging-vps
      url: https://hml.gastrocore.cesic.com.br
    steps:
      - name: Rollout via SSH na VPS / VM Ubuntu
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/gastrocore
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Healthcheck HTTP Pós-Deploy
        run: |
          curl -f -s https://hml.gastrocore.cesic.com.br/ > /dev/null
          echo "Aplicação respondendo com HTTP 200."
